<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Вход — Command Zone</title><link rel="stylesheet" href="{{url_for('static',path='style.css')}}"></head><body class="auth-page"><main class="auth-card"><div class="auth-brand"><b>C</b> COMMAND ZONE</div><small>{{'ПЕРВОНАЧАЛЬНАЯ НАСТРОЙКА' if setup else 'ВХОД В СИСТЕМУ'}}</small><h1>{{'Создайте администратора' if setup else 'С возвращением'}}</h1><p>{{'Эта учётная запись получит полный доступ к турнирам.' if setup else 'Войдите как администратор или игрок.'}}</p>{%if error%}<div class="error">{{error}}</div>{%endif%}<form action="{{'/setup' if setup else '/login'}}" method="post"><label>Логин<input name="username" required autocomplete="username"></label><label>Пароль<input name="password" type="password" minlength="8" required></label><button class="hot">{{'Создать администратора' if setup else 'Войти'}}</button></form></main></body></html>
